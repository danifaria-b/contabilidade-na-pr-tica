<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do admin — Contabilidade na Prática</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--papel:#ECE6D6;--tinta:#22301F;--tinta-suave:#55604f;--verde-razao:#2F4B3C;--vermelho-tinta:#8A2E2E;--borda:#b9ae8c;--linha:#d9d0b8;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--papel);font-family:'Source Serif 4', serif;color:var(--tinta);}
  header{padding:28px clamp(16px,4vw,48px) 20px;border-bottom:1px solid var(--borda);
    display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;}
  .rubrica{font-family:'IBM Plex Mono', monospace;font-size:12px;letter-spacing:0.04em;color:var(--tinta-suave);margin:0 0 4px;}
  h1{font-size:26px;font-weight:600;margin:0;}
  .acoes-topo{display:flex;gap:12px;align-items:center;}
  .btn-link{font-family:'IBM Plex Mono', monospace;font-size:13px;background:none;border:none;color:var(--tinta-suave);cursor:pointer;text-decoration:underline;}
  .btn-link:hover{color:var(--vermelho-tinta);}
  main{padding:24px clamp(16px,4vw,48px);}
  .filtro-box{margin-bottom:20px;display:flex;gap:12px;flex-wrap:wrap;}
  .filtro-box input{font-family:'Source Serif 4', serif;font-size:15px;padding:8px 12px;border:1px solid var(--borda);background:transparent;color:var(--tinta);border-radius:4px;min-width:240px;}
  table{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border:1px solid var(--borda);border-radius:4px;overflow:hidden;}
  th, td{padding:12px 14px;border-bottom:1px solid var(--linha);text-align:left;}
  th{background:#dfd7be;font-family:'IBM Plex Mono', monospace;font-size:12px;color:var(--verde-razao);}
  tr:hover{background:#faf8f2;}
  .badge-acerto{display:inline-block;padding:3px 8px;border-radius:4px;background:#e6f4ea;color:#137333;font-weight:600;font-size:12px;}
  .badge-erro{display:inline-block;padding:3px 8px;border-radius:4px;background:#fce8e6;color:#c5221f;font-weight:600;font-size:12px;}
</style>
</head>
<body>
  <script>
    if (sessionStorage.getItem("admin_autenticado") !== "true") {
      window.location.href = "login-admin.html";
    }
  </script>

  <header>
    <div>
      <p class="rubrica">PAINEL DE AVALIAÇÃO DOCENTE</p>
      <h1>Lançamentos dos Estudantes</h1>
    </div>
    <div class="acoes-topo">
      <span style="font-family:'IBM Plex Mono', monospace; font-size:13px;" id="admin-user">daniellafariab@gmail.com</span>
      <button class="btn-link" onclick="sair()">Encerrar Sessão</button>
    </div>
  </header>

  <main>
    <div class="filtro-box">
      <input type="text" id="filtroNome" placeholder="Filtrar por nome do aluno..." onkeyup="filtrar()">
      <button onclick="carregarLancamentos()" style="font-family:'IBM Plex Mono', monospace; font-size:13px; background:var(--verde-razao); color:#fff; border:none; padding:8px 16px; border-radius:4px; cursor:pointer;">Atualizar Dados</button>
    </div>

    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Data/Hora</th>
            <th>Nome do Aluno</th>
            <th>Exercício</th>
            <th>Débito</th>
            <th>Crédito</th>
            <th>Valor (R$)</th>
            <th>Resultado</th>
          </tr>
        </thead>
        <tbody id="listaLancamentos">
          <tr><td colspan="7" style="text-align:center; color:var(--tinta-suave);">A carregar dados...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://jfglrlitaraxrbfnjzde.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_9pq1ZG8pfXFgtiDubL4NLA_jpc4FujT";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let registrosGerais = [];

    async function carregarLancamentos() {
      const tbody = document.getElementById("listaLancamentos");
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:var(--tinta-suave);">A carregar dados...</td></tr>';
      
      const { data, error } = await supabase
        .from("lancamentos")
        .select("*")
        .order("criado_em", { ascending: false });

      if (error) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--vermelho-tinta);">Erro ao carregar dados: ${error.message}</td></tr>`;
        return;
      }

      registrosGerais = data || [];
      renderizarTabela(registrosGerais);
    }

    function renderizarTabela(dados) {
      const tbody = document.getElementById("listaLancamentos");
      tbody.innerHTML = "";

      if (dados.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:var(--tinta-suave);">Nenhum lançamento registado até ao momento.</td></tr>';
        return;
      }

      dados.forEach(r => {
        const tr = document.createElement("tr");
        const d = new Date(r.criado_em);
        const dataFmt = d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", {hour:'2-digit', minute:'2-digit'});
        const c = r.conteudo || {};
        const correto = (c.acerto !== undefined) ? c.acerto : c.correto;

        tr.innerHTML = `
          <td>${dataFmt}</td>
          <td><strong>${r.aluno_nome || '-'}</strong></td>
          <td>${r.exercicio || '-'}</td>
          <td>${c.debito || '-'}</td>
          <td>${c.credito || '-'}</td>
          <td>${c.valor ? Number(c.valor).toFixed(2) : '-'}</td>
          <td>${correto ? '<span class="badge-acerto">Correto</span>' : '<span class="badge-erro">Incorreto</span>'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filtrar() {
      const termo = document.getElementById("filtroNome").value.toLowerCase();
      const filtrados = registrosGerais.filter(r => (r.aluno_nome || "").toLowerCase().includes(termo));
      renderizarTabela(filtrados);
    }

    function sair() {
      sessionStorage.removeItem("admin_autenticado");
      sessionStorage.removeItem("admin_email");
      window.location.href = "login-admin.html";
    }

    carregarLancamentos();
  </script>
</body>
</html>
